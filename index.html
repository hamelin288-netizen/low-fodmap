async function zaloguj(email, haslo) {
  const odpowiedz = await fetch(
    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: haslo
      })
    }
  );

  const dane = await odpowiedz.json();

  if (!odpowiedz.ok) {
    throw new Error(
      dane.msg || dane.error_description ||
      dane.message || "Nie udało się zalogować."
    );
  }

  return dane;
}

function zapiszSesje(sesja) {
  tokenSesji = sesja.access_token;
  refreshTokenSesji = sesja.refresh_token;

  localStorage.setItem(
    KLUCZ_SESJI,
    JSON.stringify({
      access_token: sesja.access_token,
      refresh_token: sesja.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) +
        sesja.expires_in
    })
  );
}

async function odnowSesje(refreshToken) {
  const odpowiedz = await fetch(
    `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        refresh_token: refreshToken
      })
    }
  );

  const dane = await odpowiedz.json();

  if (!odpowiedz.ok) {
    throw new Error(
      dane.msg ||
      dane.error_description ||
      dane.message ||
      "Nie udało się odnowić sesji."
    );
  }

  zapiszSesje(dane);

  return dane;
}

async function przywrocSesje() {
  const zapisanaSesja = localStorage.getItem(KLUCZ_SESJI);

  if (!zapisanaSesja) {
    return;
  }

  try {

    if (!dane.refresh_token) {
      throw new Error("Brak tokenu odnawiania sesji.");
    }

    const teraz = Math.floor(Date.now() / 1000);

    if (
      dane.access_token &&
      dane.expires_at &&

    ) {
      sesja = dane;
      tokenSesji = dane.access_token;
      refreshTokenSesji = dane.refresh_token;

      sesja = await odnowSesje(dane.refresh_token);

    }
  }
);

if (!odpowiedzUzytkownika.ok) {

  );
}

idZalogowanegoUzytkownika = daneUzytkownika.id;

async function pobierzWaznyTokenAdministratora() {
  if (!czyZalogowanyAdministrator) {
    throw new Error("Musisz zalogować się jako administrator.");
  }

  const zapisanaSesja = localStorage.getItem(KLUCZ_SESJI);

  if (!zapisanaSesja) {
    throw new Error("Nie znaleziono zapisanej sesji.");
  }

  const dane = JSON.parse(zapisanaSesja);
  const teraz = Math.floor(Date.now() / 1000);

  if (
    dane.access_token &&
    dane.expires_at &&
    dane.expires_at > teraz + 60
  ) {
    return dane.access_token;
  }

  if (!dane.refresh_token) {
    throw new Error("Nie można odnowić sesji. Zaloguj się ponownie.");
  }

  const nowaSesja = await odnowSesje(dane.refresh_token);

  const jestAdministratorem = await sprawdzAdministratora(
    nowaSesja.access_token
  );

  if (!jestAdministratorem) {
    tokenAdministratora = null;
    czyZalogowanyAdministrator = false;

    document.getElementById(
      "panelAdministracyjny"
    ).hidden = true;

    document.getElementById(
      "sekcjaEdycji"
    ).hidden = true;

    pokazProdukty();

    throw new Error("Brak uprawnień administratora.");
  }

  tokenAdministratora = nowaSesja.access_token;

  return tokenAdministratora;
}

async function sprawdzAdministratora(token) {
  const odpowiedz = await fetch(
    `${SUPABASE_URL}/rest/v1/rpc/czy_administrator`,
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({})
    }
  );

  if (!odpowiedz.ok) {
    throw new Error(
      "Nie udało się sprawdzić uprawnień."
    );
  }

  return await odpowiedz.json();
}

async function aktualizujProduktWSupabase(id, zmiany) {
  if (!tokenAdministratora) {
  throw new Error("Musisz zalogować się jako administrator.");
}

const aktualnyToken = await pobierzWaznyTokenAdministratora();

  const odpowiedz = await fetch(
    `${SUPABASE_URL}/rest/v1/produkty?id=eq.${encodeURIComponent(id)}`,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${aktualnyToken}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify(zmiany)
    }
  );

  if (!odpowiedz.ok) {
    const szczegoly = await odpowiedz.text();
    throw new Error(
      `Błąd aktualizacji ${odpowiedz.status}: ${szczegoly}`
    );
  }

  const zaktualizowane = await odpowiedz.json();

  if (zaktualizowane.length !== 1) {
    throw new Error(
      "Nie znaleziono produktu do aktualizacji."
    );
  }

  return zaktualizowane[0];
}


async function usunProduktZSupabase(id) {

  const odpowiedz = await fetch(
    `${SUPABASE_URL}/rest/v1/produkty?id=eq.${encodeURIComponent(id)}`,
    {
      method: "DELETE",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${aktualnyToken}`,
        Prefer: "return=representation"
      }
    }
  );

  if (!odpowiedz.ok) {
    const szczegoly = await odpowiedz.text();

    throw new Error(
      `Błąd usuwania ${odpowiedz.status}: ${szczegoly}`
    );
  }

  const usuniete = await odpowiedz.json();

  if (usuniete.length !== 1) {
    throw new Error(
      "Nie znaleziono produktu do usunięcia."
    );
  }

  return usuniete[0];
}

    usunBtn.disabled = false;
  }
});
         
karta.append(
  tytul, kat, opis, porcja, status, zrodlo,
  ulubionyBtn, etykieta, notatka, zapiszBtn
);
if (czyZalogowanyAdministrator) {
  karta.append(edytujBtn, usunBtn);
}

        lista.appendChild(karta);
      });
    }

    document.getElementById("szukaj")
      .addEventListener("input", pokazProdukty);

    document.getElementById("filtr")
      .addEventListener("change", pokazProdukty);

    document.getElementById("ulubioneBtn")

        tylkoUlubione = true;

      });

    document.getElementById("wszystkieBtn")
      .addEventListener("click", () => {
        tylkoUlubione = false;
        pokazProdukty();
      });

    
document.getElementById("formularzProduktu")

    e.preventDefault();

    const status = document.getElementById("status");

    if (!tokenAdministratora) {
      status.textContent =
        "Musisz zalogować się jako administrator.";
      return;
    }

    const nowyProdukt = {
      nazwa: document.getElementById("nowaNazwa").value.trim(),
      kategoria: document.getElementById("nowaKategoria").value.trim(),
      opis: document.getElementById("nowyOpis").value.trim(),
      porcja: document.getElementById("nowaPorcja").value.trim(),
      status: document.getElementById("nowyStatus").value,
      zrodlo: document.getElementById("noweZrodlo").value.trim()
    };

    status.textContent = "Zapisuję produkt w Supabase...";

    try {
      const aktualnyToken = await pobierzWaznyTokenAdministratora();
      const odpowiedz = await fetch(
        `${SUPABASE_URL}/rest/v1/produkty`,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${aktualnyToken}`,
            "Content-Type": "application/json",
            Prefer: "return=minimal"
          },
          body: JSON.stringify(nowyProdukt)
        }
      );

      if (!odpowiedz.ok) {
        throw new Error(
          `Błąd zapisu HTTP: ${odpowiedz.status}`
        );
      }

      document.getElementById("formularzProduktu").reset();

      await wczytajCSV();

      status.textContent =
        "Produkt został zapisany w Supabase: " +
        nowyProdukt.nazwa;

    } catch (blad) {
      console.error("Błąd dodawania produktu:", blad);

      status.textContent =
        "Nie udało się zapisać produktu w Supabase.";
    }
  });

document.getElementById("formularzEdycji")
  .addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!edytowanyProdukt || !edytowanyProdukt.id) {
      return;
    }

    const status = document.getElementById("status");

    const zmiany = {
      nazwa: document.getElementById("edycjaNazwa").value.trim(),
      kategoria: document.getElementById("edycjaKategoria").value.trim(),
      opis: document.getElementById("edycjaOpis").value.trim(),
      porcja: document.getElementById("edycjaPorcja").value.trim(),
      status: document.getElementById("edycjaStatus").value,
      zrodlo: document.getElementById("edycjaZrodlo").value.trim()
    };

    status.textContent = "Zapisuję zmiany w Supabase...";

    try {
      await aktualizujProduktWSupabase(
        edytowanyProdukt.id,
        zmiany
      );

      document.getElementById("sekcjaEdycji").hidden = true;
      edytowanyProdukt = null;

      await wczytajCSV();

      status.textContent =
        "Zmiany produktu zostały zapisane w Supabase.";

    } catch (blad) {
      console.error("Błąd edycji produktu:", blad);

      status.textContent =
        "Nie udało się zapisać zmian w Supabase.";
    }
  });

    document.getElementById("anulujEdycje")
      .addEventListener("click", () => {
        document.getElementById("sekcjaEdycji").hidden = true;
        document.getElementById("formularzEdycji").reset();
        edytowanyProdukt = null;
      });
  
    document.getElementById("eksportujDane")
      .addEventListener("click", () => {
        const dane = JSON.stringify(produkty, null, 2);

        const plik = new Blob(
          [dane],
          { type: "application/json" }
        );

        const adres = URL.createObjectURL(plik);

        const link = document.createElement("a");
        link.href = adres;
        link.download = "kopia-zapasowa-low-fodmap.json";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(adres);

        document.getElementById("status").textContent =
          "Pobrano kopię zapasową produktów.";
      });
    document.getElementById("przywrocDane")
      .addEventListener("click", async () => {
        const polePliku = document.getElementById("importujDane");
        const plik = polePliku.files[0];

        if (!plik) {
          alert("Najpierw wybierz plik kopii zapasowej.");
          return;
        }

        const potwierdzenie = confirm(
          "Przywrócenie zastąpi obecną listę produktów. Czy chcesz kontynuować?"
        );

        if (!potwierdzenie) {
          return;
        }

        try {
          const tekst = await plik.text();
          const dane = JSON.parse(tekst);

          if (
            !Array.isArray(dane) ||
            !dane.every(p =>
              p &&
              typeof p === "object" &&
              !Array.isArray(p) &&
              typeof p.nazwa === "string" &&
              typeof p.kategoria === "string"
            )
          ) {
            throw new Error("Nieprawidłowy format kopii zapasowej.");
          }

          produkty = dane.map(p => ({
            nazwa: p.nazwa,
            kategoria: p.kategoria,
            opis: typeof p.opis === "string" ? p.opis : "",
            porcja: typeof p.porcja === "string"
              ? p.porcja
              : "Do uzupełnienia",
            status: typeof p.status === "string"
              ? p.status
              : "Do sprawdzenia",
            zrodlo: typeof p.zrodlo === "string" ? p.zrodlo : "",
            ulubiony: p.ulubiony === true,
            notatka: typeof p.notatka === "string" ? p.notatka : ""
          }));

          localStorage.setItem(KLUCZ, JSON.stringify(produkty));

          uzupelnijKategorie();
          pokazProdukty();

          document.getElementById("status").textContent =
            "Przywrócono produkty: " + produkty.length;

          polePliku.value = "";
        } catch (blad) {
          alert(
            "Nie udało się przywrócić danych. Wybierz prawidłową kopię zapasową."
          );
          console.error(blad);
        }
      });
  </script>
